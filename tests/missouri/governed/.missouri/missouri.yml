doc: |
  A profiled agent runs under gaff. If gaff cannot answer the session
  start, kersh aborts before any model call, so a broken or absent gaff
  never degrades into an ungoverned or dead run.
transitions:
  - name: "a profiled agent aborts when gaff cannot start"
    command: |
      root=kersh-root

      # gaff absent: KERSH_GAFF points at nothing.
      OUT=$(KERSH_GAFF=/nonexistent/gaff kersh run reviewer --root "$root" "review" 2>&1)
      code=$?
      [ "$code" != "0" ] || { echo "FAIL: a missing gaff must abort: $OUT"; exit 1; }
      case "$OUT" in
        *"gaff could not start"*) ;;
        *) echo "FAIL: the abort must say gaff could not start: $OUT"; exit 1 ;;
      esac

      # gaff present but failing session_start (exit 1).
      cat > fakegaff <<'SH'
      #!/bin/sh
      cat > /dev/null
      exit 1
      SH
      chmod +x fakegaff
      OUT=$(KERSH_GAFF="$PWD/fakegaff" kersh run reviewer --root "$root" "review" 2>&1)
      code=$?
      [ "$code" != "0" ] || { echo "FAIL: a failing gaff must abort: $OUT"; exit 1; }
      case "$OUT" in
        *"gaff could not start"*) ;;
        *) echo "FAIL: a failing gaff must abort with the reason: $OUT"; exit 1 ;;
      esac
      rm -f fakegaff

      # A profiled agent needs no prompt: its situation comes from gaff's
      # session start. With no prompt and no context file, the run reaches
      # the gaff probe rather than the "give a prompt" refusal.
      OUT=$(KERSH_GAFF=/nonexistent/gaff kersh run reviewer --root "$root" 2>&1)
      case "$OUT" in
        *"gaff could not start"*) ;;
        *"give a prompt"*) echo "FAIL: a profiled agent must not need a prompt: $OUT"; exit 1 ;;
        *) echo "FAIL: a profiled no-prompt run must reach the gaff probe: $OUT"; exit 1 ;;
      esac

      echo GOVERNED_OK
    target: ../governed-checked
    stdout: "GOVERNED_OK\n"
