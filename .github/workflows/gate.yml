name: 'gate'

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
      - name: 'rust toolchain'
        uses: 'dtolnay/rust-toolchain@stable'
        with:
          components: 'clippy, rustfmt'
      - name: 'rust cache'
        uses: 'Swatinem/rust-cache@v2'
      - name: 'format'
        run: cargo fmt --all --check
      - name: 'clippy'
        run: cargo clippy --all-targets -- -D warnings
      - name: 'test'
        run: cargo test --locked
      - name: 'install missouri'
        uses: 'cjohnhanson/missouri@main'
      - name: 'missouri'
        run: |
          if [ -d tests/missouri ]; then
            cargo build --locked
            cd tests/missouri && MISSOURI_SANDBOX=preinstalled missouri run
          fi
