name: 'verify'

on:
  push:

jobs:
  verify:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
      - name: 'rust toolchain'
        uses: 'dtolnay/rust-toolchain@1.98.0'
        with:
          'components': 'clippy, rustfmt'
      - name: 'rust cache'
        uses: 'Swatinem/rust-cache@v2'
      - name: 'install missouri'
        uses: 'cjohnhanson/missouri@main'
      - name: 'gaff'
        uses: 'cjohnhanson/gaff@main'
        with:
          'run': 'false'
      - name: 'lint and test'
        run: |
          sh -c 'sh scripts/commit-gate.sh && sh scripts/test.sh'
