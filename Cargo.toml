[package]
name = "kersh"
version = "0.8.0"
edition = "2024"
rust-version = "1.88"
description = "A declarative agent runner: a markdown file names a model, a skill, and a profile."
license = "MIT"
repository = "https://github.com/cjohnhanson/kersh"
homepage = "https://github.com/cjohnhanson/kersh"
readme = "README.md"
keywords = ["agents", "mcp", "cli", "terminal", "sessions"]
categories = ["command-line-utilities", "development-tools"]

# Repository machinery stays on GitHub. A consumer installing the crate
# gets the source, the bundled manual, the license, and the README.
exclude = [
    # The npm wrapper and its generator are release machinery; a
    # generated platform package holds a built binary, which must never
    # ship inside the crate.
    "npm/",
    "homebrew/",
    # These read .github/, npm/, homebrew/, and scripts/, all dropped.
    "tests/release.rs",
    "tests/seam_real_gaff.sh",
    "tests/missouri/",
    "tests/probes/",
    ".gaff/",
    ".github/",
    ".agents/",
    "scripts/",
    "almanac.yml",
    "AGENTS.md",
    "flake.nix",
    "flake.lock",
    "rust-toolchain.toml",
]

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[features]
default = ["tui"]
# A scripted fake model provider, for hermetic end-to-end tests. Off by
# default, so the shipped binary carries no fake provider.
fake-model = []
# The terminal UI, `kersh tui`. Off with --no-default-features, for a
# build that needs only the commands, the MCP server, and the host.
tui = ["dep:ratatui", "dep:mdstore"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "fs", "time", "net", "signal", "sync"] }
# Safe wrappers over the few process and terminal calls the session host
# and its wrapper need (setsid, kill, flock, the window size), so the
# crate keeps `forbid(unsafe_code)`.
rustix = { version = "1", features = ["fs", "process", "termios", "std"] }
# Conversation ids handed to Claude Code at launch.
uuid = { version = "1", features = ["v4"] }
# The read tools: ripgrep as libraries, no shell and no honored config.
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
globset = "0.4"
getrandom = "0.3"
rig-core = { version = "0.41", default-features = false }
rig = "0.41"
rig-claude-code = { git = "https://github.com/cjohnhanson/rig-claude-code", rev = "bf31a6b610a0d8f5ba6315d6930a793981c7ac68", version = "0.1.0" }
clap = { version = "4.6", features = ["derive"] }
# The terminal sessions, behind the `Sessions` trait in src/sessions.rs.
# Pinned exactly: an upgrade is its own change with the gates rerun. The
# server's default `web` feature adds a TCP share listener, so it is off.
# rmux-client turns on rmux-sdk's `web` feature, which adds only the
# client calls for that listener; with the server feature off, no
# listener exists to reach.
rmux-sdk = { version = "=0.10.0", default-features = false }
rmux-client = { version = "=0.10.0", default-features = false }
rmux-proto = { version = "=0.10.0", default-features = false }
rmux-server = { version = "=0.10.0", default-features = false }
# `kersh serve`: MCP on stdio only. The streamable HTTP transport is off,
# so the server opens no listener.
rmcp = { version = "3", default-features = false, features = ["server", "transport-io"] }
# REST on the host's Unix socket, `host.sock`, with its OpenAPI document
# generated from the same types the handlers return. axum's `tokio`
# feature serves a `UnixListener`; nothing binds TCP.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
utoipa = "6"
# The record stream of `GET /v1/changes`.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# kersh::Client's side of host.sock. Already in the tree through rig;
# `blocking` keeps the calls synchronous, and `unix_socket` routes every
# request to the socket file, so no request reaches the network.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
# The terminal UI. ratatui re-exports the crossterm it was built
# against. mdstore-core's `tui` kit is the family's keymap file, Emacs
# preset, and Editor.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"], optional = true }
mdstore = { version = "0.6", package = "mdstore-core", default-features = false, features = ["tui"], optional = true }

[dev-dependencies]
tempfile = "3"
# Snapshots of the rendered terminal UI, one per screen and state.
insta = "1.49"
# Checks that the served OpenAPI document parses as OpenAPI 3.1.
oas3 = "0.20"

# `cargo deb` reads this for the .deb the release attaches to the GitHub
# release. It installs with `dpkg -i`; it is not an apt repository.
[package.metadata.deb]
maintainer = "cjohnhanson <cjohnhanson@users.noreply.github.com>"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = "A declarative agent runner: a markdown file names a model, a skill, and a profile."
assets = [
    ["target/release/kersh", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/kersh/README", "644"],
    ["LICENSE", "usr/share/doc/kersh/LICENSE", "644"],
]
