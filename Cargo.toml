[package]
name = "kersh"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "A declarative agent runner: a markdown file names a model, a skill, and a profile."
license = "MIT"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[features]
# A scripted fake model provider, for hermetic end-to-end tests. Off by
# default, so the shipped binary carries no fake provider.
fake-model = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "fs", "time"] }
# The read tools: ripgrep as libraries, no shell and no honored config.
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
globset = "0.4"
getrandom = "0.3"
rig-core = { version = "0.41", default-features = false }
rig = "0.41"
rig-claude-code = { git = "https://github.com/cjohnhanson/rig-claude-code", rev = "9ebacb6ecd7fe55fb98c9f00790b2a6be950086a", version = "0.1.0" }

[dev-dependencies]
tempfile = "3"
